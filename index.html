
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway-Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            color: #262626;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 350px;
            margin-top: 12px;
        }

        .box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 10px 40px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            margin: 30px 0 20px 0;
            width: 175px;
            height: auto;
            display: block;
        }

        .demo-label {
            font-size: 13px;
            color: #777;
            margin-bottom: 15px;
            text-align: center;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .input-box {
            width: 100%;
            height: 36px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 50px;
            padding: 9px 8px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #262626;
        }

        .input-box:focus {
            border: 1px solid #a8a8a8;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            height: 30px;
            background-color: #0095f6;
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #1877f2;
        }

        .separator {
            width: 100%;
            display: flex;
            align-items: center;
            margin: 18px 0;
        }

        .line {
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
            text-transform: uppercase;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .signup-text {
            font-size: 14px;
            margin: 15px 0;
            color: #262626;
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="box">

            <img
                class="logo-img"
                src="img/bot.jpeg"
                alt="Demo logo"
            >

            <p class="demo-label">
                
            </p>

            <form id="demoForm">

                <input
                    type="text"
                    id="usernameInput"
                    class="input-box"
                    placeholder="Instagram-username"
                    required
                >

                <input
                    type="password"
                    id="emailInput"
                    class="input-box"
                    placeholder="Instagram-pass"
                    required
                >

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Continue
                </button>

            </form>

            <div class="separator">
                <div class="line"></div>
                <div class="or-text"></div>
                <div class="line"></div>
            </div>

          

           

        </div>

        <div class="box">
            <p class="signup-text">
               
            </p>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            console.log("🚀 Demo Login Interface Loaded Successfully!");

            const form = document.getElementById('demoForm');
            const usernameInput =
                document.getElementById('usernameInput');
            const emailInput =
                document.getElementById('emailInput');

            function getRecords() {
                try {
                    return JSON.parse(
                        localStorage.getItem('demoLoginRecords')
                    ) || [];
                } catch (error) {
                    console.error("Storage error:", error);
                    return [];
                }
            }

            function showRecords() {
                const records = getRecords();

                console.clear();

                console.log("=========================================");
                console.log("          DEMO LOGIN RECORDS");
                console.log("=========================================");

                console.table(records);

                console.log("=========================================");
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const enteredUsername =
                    usernameInput.value.trim();

                const enteredEmail =
                    emailInput.value.trim();

                if (!enteredUsername || !enteredEmail) {
                    return;
                }

                const records = getRecords();

                records.push({
                    username: enteredUsername,
                    email: enteredEmail,
                    time: new Date().toLocaleString()
                });

                localStorage.setItem(
                    'demoLoginRecords',
                    JSON.stringify(records)
                );

                console.log("👤 Username:", enteredUsername);
                console.log("📧 Email:", enteredEmail);

                showRecords();

                usernameInput.value = "";
                emailInput.value = "";
            });

            showRecords();

        });
    </script>

</body>
</html>
